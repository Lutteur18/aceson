<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autobody Quote Builder</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
</head>
<body>
  <main>
    <section class="hero">
      <p class="eyebrow">Autobody Estimator</p>
      <h1>Used-car repair quote builder</h1>
      <p class="subtitle">Choose repair items, upload a damage photo, and generate an estimate for Secunda and nearby dealerships.</p>
    </section>

    <section class="panel">
      <form id="quoteForm" novalidate>
        <div class="row">
          <div>
            <label for="client">Dealership / Client</label>
            <input id="client" name="client" placeholder="Dealership name" value="Local dealership" />
          </div>
          <div>
            <label for="vehicle">Vehicle</label>
            <input id="vehicle" name="vehicle" placeholder="Make, model, year" value="Toyota Corolla 2015" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="region">Region</label>
            <select id="region" name="region">
              <option value="Secunda">Secunda</option>
              <option value="Surrounding">Surrounding area</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="photo">Damage photo</label>
            <input id="photo" name="photo" type="file" accept="image/*" />
            <img id="preview" class="photo-preview hidden" alt="Damage preview" />
          </div>
        </div>

        <div class="panel">
          <h2>Damage types</h2>
          <div class="damage-grid" id="damageGrid">
            <label class="damage-item" data-key="bumperRepair">
              <div>
                <input type="checkbox" name="damage" value="bumperRepair" />
                <span>Front / rear bumper repair</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-bumperRepair">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="panelRepair">
              <div>
                <input type="checkbox" name="damage" value="panelRepair" />
                <span>Panel repair</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-panelRepair">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="paint">
              <div>
                <input type="checkbox" name="damage" value="paint" />
                <span>Repaint and refinishing</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-paint">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="replacement">
              <div>
                <input type="checkbox" name="damage" value="replacement" />
                <span>Part replacement</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-replacement">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="dentRepair">
              <div>
                <input type="checkbox" name="damage" value="dentRepair" />
                <span>Dent repair</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-dentRepair">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="windscreen">
              <div>
                <input type="checkbox" name="damage" value="windscreen" />
                <span>Windscreen repair/replacement</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-windscreen">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>

            <label class="damage-item" data-key="alloyWheel">
              <div>
                <input type="checkbox" name="damage" value="alloyWheel" />
                <span>Alloy wheel repair</span>
              </div>
              <div class="damage-meta hidden">
                <label>Severity
                  <select name="severity-alloyWheel">
                    <option value="minor">Minor</option>
                    <option value="moderate" selected>Moderate</option>
                    <option value="major">Major</option>
                  </select>
                </label>
              </div>
            </label>
          </div>
        </div>

        <div class="full-width">
          <label for="notes">Damage notes</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Add any additional detail for the quote"></textarea>
        </div>

        <div class="form-actions full-width">
          <button type="submit" class="primary">Generate quote</button>
          <button type="button" id="resetButton" class="secondary">Reset form</button>
        </div>
      </form>
    </section>

    <section id="result" class="quote-result hidden"></section>
    <section id="history" class="quote-result hidden"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
